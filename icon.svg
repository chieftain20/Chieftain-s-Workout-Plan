<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00e599"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="6"/>

  <!-- Dumbbell with Heart Graphic -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Barbell Left Bar -->
    <rect x="140" y="244" width="70" height="24" rx="12" fill="url(#glowGrad)"/>
    <!-- Barbell Right Bar -->
    <rect x="302" y="244" width="70" height="24" rx="12" fill="url(#glowGrad)"/>

    <!-- Left Outer Plate -->
    <rect x="74" y="200" width="22" height="112" rx="11" fill="url(#glowGrad)"/>
    <!-- Left Mid Plate -->
    <rect x="104" y="170" width="24" height="172" rx="12" fill="url(#glowGrad)"/>
    <!-- Left Inner Plate -->
    <rect x="136" y="146" width="26" height="220" rx="13" fill="url(#glowGrad)"/>
    <!-- Left Collar -->
    <rect x="168" y="226" width="16" height="60" rx="8" fill="url(#glowGrad)"/>

    <!-- Right Collar -->
    <rect x="328" y="226" width="16" height="60" rx="8" fill="url(#glowGrad)"/>
    <!-- Right Inner Plate -->
    <rect x="350" y="146" width="26" height="220" rx="13" fill="url(#glowGrad)"/>
    <!-- Right Mid Plate -->
    <rect x="384" y="170" width="24" height="172" rx="12" fill="url(#glowGrad)"/>
    <!-- Right Outer Plate -->
    <rect x="416" y="200" width="22" height="112" rx="11" fill="url(#glowGrad)"/>

    <!-- Center Heart Contour & Fill -->
    <path d="M 256, 328
             C 256, 328 184, 276 184, 218
             C 184, 186 208, 164 238, 164
             C 256, 164 256, 178 256, 178
             C 256, 178 256, 164 274, 164
             C 304, 164 328, 186 328, 218
             C 328, 276 256, 328 256, 328 Z"
          fill="none" stroke="url(#glowGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>